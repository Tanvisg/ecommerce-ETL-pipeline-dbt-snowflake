version: 2

models:

  # =========================
  # STAGING
  # =========================

  - name: src_customers
    description: "Cleaned customer data from the raw customer table."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: email
        tests:
          - not_null

  - name: src_products
    description: "Cleaned product master data."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: sku
        tests:
          - not_null
          - unique

  - name: src_orders
    description: "Cleaned order header data."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

  - name: src_order_items
    description: "Individual items belonging to each order."
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

  - name: src_payments
    description: "Payment information associated with orders."
    columns:
      - name: order_id
        tests:
          - not_null


  # =========================
  # DIMENSIONS
  # =========================

  - name: dim_customers
    description: "Customer dimension containing customer attributes."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: email
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension containing product and pricing attributes."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: sku
        tests:
          - not_null
          - unique

  - name: dim_dates
    description: "Date dimension used for time-based analysis."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: date
        tests:
          - not_null
          - unique


  # =========================
  # FACTS
  # =========================

  - name: fct_sales
    description: "One row per order item containing sales and margin metrics."
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: net_amount
        tests:
          - not_null

  - name: fct_orders
    description: "One row per order containing aggregated order metrics."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: net_amount
        tests:
          - not_null


  # =========================
  # MARTS
  # =========================

  - name: mart_monthly_revenue
    description: "Monthly revenue, order, customer and margin metrics."
    columns:
      - name: month_start
        tests:
          - not_null
          - unique

      - name: net_revenue
        tests:
          - not_null

  - name: mart_revenue_breakdown
    description: "Revenue breakdown by month, category, channel and country."
    columns:
      - name: month_start
        tests:
          - not_null

      - name: category
        tests:
          - not_null

      - name: net_revenue
        tests:
          - not_null

  - name: mart_customer_rfm
    description: "Customer recency, frequency and monetary analysis."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_segment
        tests:
          - not_null

  - name: mart_cohort_retention
    description: "Customer cohort activity and retention analysis."
    columns:
      - name: cohort_month
        tests:
          - not_null

      - name: order_month
        tests:
          - not_null

  - name: mart_product_performance
    description: "Product-level revenue, units and margin performance."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: revenue
        tests:
          - not_null

  - name: mart_coupon_effectiveness
    description: "Performance of orders using different coupons."
    columns:
      - name: coupon_code
        tests:
          - not_null
          - unique

  - name: mart_order_status_rates
    description: "Order cancellation and return rates by year, channel and payment method."
    columns:
      - name: year
        tests:
          - not_null

      - name: channel
        tests:
          - not_null